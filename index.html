<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace Dynamics | Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #2c3e50;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2e5bff; /* Royal Blue */
            margin-bottom: 1.5rem;
        }

        .tagline {
            font-size: 1.2rem;
            color: #5a6c7d;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .coming-soon {
            font-size: 1.8rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        .description {
            font-size: 1rem;
            color: #5a6c7d;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .contact {
            font-size: 0.9rem;
            color: #5a6c7d;
            margin-top: 2rem;
        }

        .contact a {
            color: #2e5bff;
            text-decoration: none;
            font-weight: 500;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        .footer {
            position: fixed;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Trace Dynamics</div>
        <div class="tagline">
            Innovating at the intersection of data and dynamics.
        </div>
        <div class="coming-soon">Coming Soon</div>
        <div class="description">
            We're currently in stealth mode, building something remarkable.
            Stay tuned for updates.
        </div>
        <div class="contact">
            For inquiries, reach out at <a href="mailto:hello@tracedynamics.com">hello@tracedynamics.com</a>
        </div>
    </div>
    <div class="footer">
        &copy; 2025 Trace Dynamics. All rights reserved.
    </div>
</body>
</html>
